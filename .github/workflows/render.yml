name: Render video

on:
  workflow_dispatch:
    inputs:
      story:
        description: "Cerita (kosongkan untuk memakai file adegan di repo)"
        required: false
        default: ""
      narration:
        description: "Suara narasi"
        type: choice
        options:
          - "ya"
          - "tidak"
        default: "ya"
      scene:
        description: "File adegan (dipakai jika cerita kosong)"
        default: "res://scene.json"

env:
  GODOT_VERSION: "4.4.1-stable"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pasang Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang kebutuhan
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg unzip libgl1-mesa-dri libglx-mesa0 \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libfontconfig1
          python -m pip install edge-tts

      - name: Unduh Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}_linux.x86_64" godot
          chmod +x godot

      - name: Render
        env:
          GODOT: ${{ github.workspace }}/godot
          STORY: ${{ inputs.story }}
          NARRATION: ${{ inputs.narration }}
          SCENE_INPUT: ${{ inputs.scene }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: bash render.sh "$SCENE_INPUT" out.mp4

      - name: Unggah video
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out.mp4

      - name: Unggah adegan hasil (untuk disimpan)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adegan
          path: build/scene*.json
          if-no-files-found: ignore
